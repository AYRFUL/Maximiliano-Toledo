<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Evita que Google y otros buscadores indexen esta página -->
  <meta name="robots" content="noindex, nofollow">

  <title>Tarjeta Digital - Ayrful</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .card-container {
      width: 320px;
      height: 568px;
      perspective: 1000px;
      position: relative;
    }
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .card.flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
    }
    .back {
      transform: rotateY(180deg);
    }

    /* Ocultamiento dinámico para evitar clics indeseados en la cara trasera */
    .front-links { display: block; }
    .back-links { display: none; }

    .card.flipped .front-links { display: none; }
    .card.flipped .back-links { display: block; }

    /* Estilo base de los enlaces */
    .btn-link, .btn-web-front, .btn-web-back {
      position: absolute;
      z-index: 100;
      text-decoration: none;
      background: transparent;
    }

    /* Posiciones en el Frente */
    .btn-link { left: 12%; width: 76%; height: 38px; }
    .btn-wa   { top: 51%; }
    .btn-tel  { top: 61%; }
    .btn-mail { top: 71%; }
    .btn-map  { top: 81%; }

    .btn-web-front {
      top: 91%;
      left: 10%;
      width: 80%;
      height: 8%;
    }

    /* Posición en el Dorso (www.ayrful.com.ar) */
    .btn-web-back {
      top: 83%;
      left: 10%;
      width: 80%;
      height: 7%;
    }

    /* Botón Flotante Inferior */
    .flip-btn {
      margin-top: 20px;
      background: #1f2937;
      color: #ffffff;
      border: 1px solid #374151;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    .flip-btn:hover {
      background: #374151;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="card" id="card" onclick="handleCardClick(event)">
      
      <!-- FRENTE -->
      <div class="face front">
        <img src="pagina1.png" alt="Frente Ayrful" id="imgFront">

        <div class="front-links">
          <!-- Botones con los datos de M. Toledo -->
          <a href="https://wa.link/4ijgv7" target="_blank" class="btn-link btn-wa" title="WhatsApp"></a>
          <a href="tel:+541132917719" class="btn-link btn-tel" title="Llamar"></a>
          <a href="mailto:mtoledo@ayrful.com.ar" class="btn-link btn-mail" title="Email"></a>
          <a href="https://maps.app.goo.gl/SNQX7NNQ1LH4BBee8" target="_blank" class="btn-link btn-map" title="Ubicación"></a>
          <a href="https://ayrful.com.ar/" target="_blank" class="btn-web-front" title="Sitio Web"></a>
        </div>
      </div>

      <!-- DORSO -->
      <div class="face back">
        <img src="pagina2.png" alt="Dorso Ayrful" id="imgBack">

        <div class="back-links">
          <!-- Botón del Dorso -->
          <a href="https://ayrful.com.ar/" target="_blank" class="btn-web-back" title="Sitio Web Ayrful"></a>
        </div>
      </div>

    </div>
  </div>

  <button class="flip-btn" onclick="rotateCard()">
    🔄 Girar tarjeta 360°
  </button>

  <script>
    function rotateCard() {
      document.getElementById('card').classList.toggle('flipped');
    }

    function handleCardClick(event) {
      // Si el usuario toca sobre un enlace <a>, abre el link y NO gira la tarjeta
      if (event.target.tagName.toLowerCase() === 'a') {
        return;
      }
      // Si toca en cualquier otra área de la tarjeta, la gira
      rotateCard();
    }

    // Detector de nombres alternativos por si Windows renombró los archivos
    const imgFront = document.getElementById('imgFront');
    imgFront.onerror = function() {
      if (this.src.includes('pagina1.png')) this.src = 'pagina1.png.png';
      else if (this.src.includes('pagina1.png.png')) this.src = 'pagina1.JPG';
    };

    const imgBack = document.getElementById('imgBack');
    imgBack.onerror = function() {
      if (this.src.includes('pagina2.png')) this.src = 'pagina2.png.png';
      else if (this.src.includes('pagina2.png.png')) this.src = 'pagina2.JPG';
    };
  </script>

</body>
</html>

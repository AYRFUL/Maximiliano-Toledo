<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Evita que Google y otros buscadores indexen esta página -->
  <meta name="robots" content="noindex, nofollow">

  <title>Tarjeta Digital - Ayrful</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .card-container {
      width: 320px;
      height: 568px;
      perspective: 1000px;
      position: relative;
    }
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card.flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
    }
    .back {
      transform: rotateY(180deg);
    }

    /* Zona transparente para girar haciendo clic */
    .flip-zone {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: pointer;
    }

    /* Estilo base de los enlaces */
    .btn-link, .btn-web-front, .btn-web-back {
      position: absolute;
      z-index: 100;
      text-decoration: none;
      background: transparent;
      pointer-events: auto;
    }

    /* Posiciones en el Frente */
    .btn-link { left: 12%; width: 76%; height: 38px; }
    .btn-wa   { top: 47%; }
    .btn-tel  { top: 57%; }
    .btn-mail { top: 67%; }
    .btn-map  { top: 77%; }

    .btn-web-front {
      top: 91%;
      left: 10%;
      width: 80%;
      height: 7%;
    }

    /* Posición en el Dorso (www.ayrful.com.ar) */
    .btn-web-back {
      top: 91%;
      left: 10%;
      width: 80%;
      height: 7%;
    }

    /* Botón Flotante Inferior */
    .flip-btn {
      margin-top: 20px;
      background: #1f2937;
      color: #ffffff;
      border: 1px solid #374151;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="card" id="card">
      
      <!-- FRENTE -->
      <div class="face front">
        <img src="pagina1.png" alt="Frente Ayrful" id="imgFront">
        
        <div class="flip-zone" onclick="rotateCard()" title="Girar tarjeta"></div>

        <!-- Botones con los datos de mtoledo -->
        <a href="https://wa.link/4ijgv7" target="_blank" class="btn-link btn-wa" title="WhatsApp"></a>
        <a href="tel:+541132917719" class="btn-link btn-tel" title="Llamar"></a>
        <a href="mailto:mtoledo@ayrful.com.ar" class="btn-link btn-mail" title="Email"></a>
        <a href="https://maps.app.goo.gl/SNQX7NNQ1LH4BBee8" target="_blank" class="btn-link btn-map" title="Ubicación"></a>
        <a href="https://ayrful.com.ar/" target="_blank" class="btn-web-front" title="Sitio Web"></a>
      </div>

      <!-- DORSO -->
      <div class="face back">
        <img src="pagina2.png" alt="Dorso Ayrful" id="imgBack">
        
        <div class="flip-zone" onclick="rotateCard()" title="Volver al frente"></div>

        <a href="https://ayrful.com.ar/" target="_blank" class="btn-web-back" title="Sitio Web Ayrful"></a>
      </div>

    </div>
  </div>

  <button class="flip-btn" onclick="rotateCard()">
    Girar tarjeta 360°
  </button>

  <script>
    function rotateCard() {
      document.getElementById('card').classList.toggle('flipped');
    }

    // Detector de nombres alternativos por si Windows renombró los archivos
    const imgFront = document.getElementById('imgFront');
    imgFront.onerror = function() {
      if (this.src.includes('pagina1.png')) this.src = 'pagina1.png.png';
      else if (this.src.includes('pagina1.png.png')) this.src = 'pagina1.JPG';
    };

    const imgBack = document.getElementById('imgBack');
    imgBack.onerror = function() {
      if (this.src.includes('pagina2.png')) this.src = 'pagina2.png.png';
      else if (this.src.includes('pagina2.png.png')) this.src = 'pagina2.JPG';
    };
  </script>

</body>
</html>

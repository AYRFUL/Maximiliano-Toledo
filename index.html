<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta Digital - Ayrful</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .card-container {
      width: 320px;
      height: 568px;
      perspective: 1000px;
      position: relative;
    }
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .card.flipped {
      transform: rotateY(180deg);
    }
    
    /* Desactiva los botones del frente cuando la tarjeta se da vuelta */
    .card.flipped .front .btn-link,
    .card.flipped .front .btn-web-front {
      display: none !important;
      pointer-events: none !important;
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .back {
      transform: rotateY(180deg);
    }

    /* Enlaces directos a redes/contacto del FRENTE */
    .btn-link {
      position: absolute;
      left: 12%;
      width: 76%;
      height: 38px;
      text-decoration: none;
      border-radius: 10px;
      z-index: 50;
    }

    /* Posiciones verticales en el Frente */
    .btn-wa   { top: 50%; }
    .btn-tel  { top: 60%; }
    .btn-mail { top: 70%; }
    .btn-map  { top: 80%; }

    /* Sitio Web en la base del Frente (www.ayrful.com.ar) */
    .btn-web-front {
      position: absolute;
      top: 91%;
      left: 10%;
      width: 80%;
      height: 8%;
      text-decoration: none;
      border-radius: 8px;
      z-index: 50;
    }

    /* Sitio Web en la base del DORSO (Siempre activo y cliqueable) */
    .btn-web-back {
      position: absolute;
      top: 91%;
      left: 10%;
      width: 80%;
      height: 8%;
      text-decoration: none;
      border-radius: 8px;
      z-index: 100 !important;
      pointer-events: auto !important;
    }

    /* Zonas para activar el giro de la tarjeta */
    .flip-zone {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* Botón flotante inferior para girar */
    .flip-btn {
      margin-top: 20px;
      background: #1f2937;
      color: #ffffff;
      border: 1px solid #374151;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="card" id="card">
      
      <!-- FRENTE: Botones de contacto + Enlace web al pie -->
      <div class="face front">
        <img src="pagina1.png" alt="Frente Ayrful" onerror="this.src='pagina1.png.png'">
        
        <div class="flip-zone" onclick="rotateCard()" title="Girar tarjeta"></div>

        <a href="https://wa.link/4ijgv7" target="_blank" class="btn-link btn-wa" title="WhatsApp"></a>
        <a href="tel:+541132917719" class="btn-link btn-tel" title="Llamar"></a>
        <a href="mailto:mtoledo@ayrful.com.ar" class="btn-link btn-mail" title="Email"></a>
        <a href="https://maps.app.goo.gl/SNQX7NNQ1LH4BBee8" target="_blank" class="btn-link btn-map" title="Ubicación"></a>
        <a href="https://ayrful.com.ar/" target="_blank" class="btn-web-front" title="Sitio Web"></a>
      </div>

      <!-- DORSO: Fondo para girar + Enlace interactivo en la parte inferior -->
      <div class="face back">
        <img src="pagina2.png" alt="Dorso Ayrful" onerror="this.src='pagina2.png.png'">
        
        <!-- Enlace interactivo único en el dorso -->
        <a href="https://ayrful.com.ar/" target="_blank" rel="noopener noreferrer" class="btn-web-back" title="Sitio Web Ayrful"></a>

        <!-- Zona para girar de vuelta al tocar el fondo -->
        <div class="flip-zone" onclick="rotateCard()" title="Volver al frente"></div>
      </div>

    </div>
  </div>

  <button class="flip-btn" onclick="rotateCard()">
    Girar tarjeta 360°
  </button>

  <script>
    function rotateCard() {
      document.getElementById('card').classList.toggle('flipped');
    }
  </script>

</body>
</html>
